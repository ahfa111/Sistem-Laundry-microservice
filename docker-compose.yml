version: '3.8'

services:
  customer-service:
    build: ./Customer-service
    container_name: customer_service
    ports:
      - "3003:3002"
    environment:
      - DB_HOST=host.docker.internal
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=customer_db
    networks:
      - laundry_network

  laundry-service:
    build: ./Laundry-service
    container_name: laundry_service
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=host.docker.internal
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=laundry_db
    networks:
      - laundry_network

  order-service:
    build: ./Order-service
    container_name: order_service
    ports:
      - "5002:5002"
    environment:
      - DB_HOST=host.docker.internal
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=order_db
    networks:
      - laundry_network

  payment-service:
    build: ./Payment-service
    container_name: payment_service
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=host.docker.internal
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=payment_db
    networks:
      - laundry_network

  voucher-service:
    build: ./Voucher-service
    container_name: voucher_service
    ports:
      - "3004:3002"
    environment:
      - DB_HOST=host.docker.internal
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=voucher_db
    networks:
      - laundry_network

  api-gateway:
    build: ./api-gateway
    container_name: api_gateway
    ports:
      - "8080:8080"
    depends_on:
      - customer-service
      - laundry-service
      - order-service
      - payment-service
      - voucher-service
    networks:
      - laundry_network

  graphql-gateway:
    build: ./graphql-gateway
    container_name: graphql_gateway
    ports:
      - "4000:4000"
    depends_on:
      - customer-service
      - laundry-service
      - order-service
      - payment-service
      - voucher-service
    networks:
      - laundry_network

networks:
  laundry_network:
    driver: bridge
